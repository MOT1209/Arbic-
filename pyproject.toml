[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "al-arabiya"
version = "0.1.0"
description = "AlArabiya (العربية) — a programming language with Arabic syntax"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Ahmed Sameh" }]
keywords = ["arabic", "programming-language", "compiler", "interpreter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Repository = "https://github.com/ahmedfox1/masry"

[project.scripts]
arabic = "al_arabiya.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["al_arabiya"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["al_arabiya"]
warn_unreachable = true
